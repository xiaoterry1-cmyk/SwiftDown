name: Bug report
description: Something in SwiftDown isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first to avoid duplicates.
  - type: input
    id: app-version
    attributes:
      label: SwiftDown version
      description: SwiftDown → About SwiftDown
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "macOS 15.5"
    validations:
      required: true
  - type: dropdown
    id: mac-type
    attributes:
      label: Mac type
      options:
        - Apple silicon
        - Intel
    validations:
      required: true
  - type: dropdown
    id: view-mode
    attributes:
      label: View mode
      description: Which mode were you in when the problem happened?
      multiple: true
      options:
        - Inline (⌘1)
        - Source (⌘2)
        - Split (⌘3)
        - Preview (⌘4)
        - Not related to a view mode
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a document containing ...
        2. Switch to Inline mode
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: Markdown to reproduce
      description: A minimal snippet that triggers the problem. Remove anything sensitive.
      render: markdown
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, recordings, or crash logs
      description: Drag files here. For crashes, include the crash report from Console.app.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: File size, text encoding, or anything else that might help.
