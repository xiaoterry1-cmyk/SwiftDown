name: Feature request
description: Suggest an idea or improvement for SwiftDown.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check whether a similar idea already exists before opening a new one.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way?
      placeholder: "When I ..., I keep needing to ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like SwiftDown to handle this?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: How do you handle this today, if at all?
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, screenshots, or examples from other apps.
